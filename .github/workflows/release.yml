name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.290.0
          vulkan-use-cache: true

      - name: Prepare vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.vcpkg-cache" | Out-Null

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-cache
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT fetch --depth 1 origin a2f9862da6d88040a8537fb9b8cb24deaa9a196b
          git -C $env:VCPKG_ROOT checkout a2f9862da6d88040a8537fb9b8cb24deaa9a196b
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package Windows zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') { $tag = 'v0.1.0' }
          $ver = $tag.TrimStart('v')
          $stage = "package/voxel-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/shaders", "$stage/data", "$stage/assets/textures" | Out-Null
          Copy-Item build/voxel.exe, build/voxel_desktop.exe -Destination $stage
          Copy-Item build/shaders/*.spv -Destination "$stage/shaders"
          Copy-Item -Recurse data/* -Destination "$stage/data"
          Copy-Item -Recurse assets/textures/* -Destination "$stage/assets/textures"
          Copy-Item README-windows.txt -Destination $stage
          $dllDirs = @("build", "build/vcpkg_installed/x64-windows/bin")
          foreach ($dir in $dllDirs) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Filter *.dll -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -ne 'vulkan-1.dll' } |
                ForEach-Object { Copy-Item $_.FullName -Destination $stage -Force }
            }
          }
          $zip = "package/voxel-v$ver-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          Get-ChildItem package

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: voxel-windows-x64
          path: package/voxel-v*-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 25
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build glslc g++ gcc build-essential pkg-config \
            mesa-vulkan-drivers vulkan-validationlayers \
            autoconf autoconf-archive automake libtool \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev \
            python3

      - name: Prepare vcpkg binary cache directory
        run: mkdir -p "${{ github.workspace }}/.vcpkg-cache"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-cache
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin a2f9862da6d88040a8537fb9b8cb24deaa9a196b
          git -C "$VCPKG_ROOT" checkout a2f9862da6d88040a8537fb9b8cb24deaa9a196b
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build

      - name: Package Linux tarball
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v0.1.0"; fi
          VER="${TAG#v}"
          STAGE="package/voxel-${TAG}-linux-x64"
          mkdir -p "$STAGE/shaders" "$STAGE/data" "$STAGE/assets/textures"
          cp build/voxel build/voxel_desktop "$STAGE/"
          cp build/shaders/*.spv "$STAGE/shaders/"
          cp -r data/* "$STAGE/data/"
          cp -r assets/textures/* "$STAGE/assets/textures/"
          cp README.md "$STAGE/"
          tar -czf "package/voxel-v${VER}-linux-x64.tar.gz" -C package "voxel-${TAG}-linux-x64"
          ls -la package/

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: voxel-linux-x64
          path: package/voxel-v*-linux-x64.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: voxel-windows-x64
          path: dist

      - name: Download Linux package
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voxel-linux-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          body_path: docs/release-notes-v0.1.0.md
          files: dist/*
          fail_on_unmatched_files: false
